<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Handcrafted Wood Objects by Madey Design</title>
  <meta name="description" content="Browse the Madey Design collection — turned wood bowls, serving boards, candle holders, bud vases, and sculptural furniture. All pieces handcrafted in San Francisco by Yedam Park." />
  <meta name="keywords" content="handcrafted wood bowls, turned wood San Francisco, wood serving boards, walnut maple objects, Madey Design gallery, Yedam Park woodwork" />
  <link rel="canonical" href="https://madey.com/gallery" />
  <meta property="og:site_name" content="Madey Design" />
  <meta property="og:title" content="Gallery — Handcrafted Wood Objects by Madey Design" />
  <meta property="og:description" content="Turned wood bowls, serving boards, candle holders, and sculptural furniture. All handcrafted in San Francisco by Yedam Park." />
  <meta property="og:image" content="https://madey.com/images/product-bowl.jpg" />
  <meta property="og:url" content="https://madey.com/gallery" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gallery — Madey Design" />
  <meta name="twitter:description" content="Handcrafted wood objects and furniture made in San Francisco." />
  <meta name="twitter:image" content="https://madey.com/images/product-bowl.jpg" />
  <script id="collectionLd" type="application/ld+json"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f7f3ee;
      --bark:  #7a5c3e;
      --wood:  #4a2e14;
      --ink:   #1e160f;
      --warm:  #c9b99a;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    /* NAV */
    .nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 40px;
      background: rgba(247,243,238,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid #ede8df;
    }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 300; letter-spacing: 0.06em; }
    .nav-links { list-style: none; display: flex; gap: 32px; }
    .nav-links a { font-size: 12px; letter-spacing: 0.1em; opacity: 0.55; transition: opacity 200ms; }
    .nav-links a:hover, .nav-links a.active { opacity: 1; }
    .nav-hamburger { display: none; flex-direction: column; gap: 6px; background: none; border: none; cursor: pointer; }
    .nav-hamburger span { display: block; width: 20px; height: 1px; background: var(--ink); }

    /* MOBILE MENU */
    .mobile-menu { position: fixed; inset: 0; z-index: 200; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .mobile-menu[hidden] { display: none; }
    .mobile-menu ul { list-style: none; text-align: center; }
    .mobile-menu li { margin: 20px 0; }
    .mobile-menu a { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; }
    .mobile-menu-close { position: absolute; top: 24px; right: 28px; background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.5; }

    /* PAGE HEADER */
    .page-header {
      padding: 56px 40px 40px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      border-bottom: 1px solid #ede8df;
    }
    .page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 300; }
    .page-header h1 em { font-style: italic; }
    .page-header p { font-size: 12px; letter-spacing: 0.1em; color: var(--bark); }

    /* SHOP GRID */
    .shop { padding: 32px 40px 80px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px 24px;
    }

    .product { display: flex; flex-direction: column; gap: 14px; cursor: pointer; }
    .product-img {
      aspect-ratio: 1/1;
      overflow: hidden;
      background: #ede8df;
    }
    .product-img img {
      display: block; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      transition: transform 700ms ease;
    }
    .product:hover .product-img img { transform: scale(1.04); }

    /* white balance fix for cool studio shots */
    .wb-cool img {
      filter: sepia(0.06) saturate(1.1) hue-rotate(-6deg) brightness(1.02);
    }

    .product-info { display: flex; flex-direction: column; gap: 5px; }
    .product-name { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 300; }
    .product-sold { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bark); opacity: 0.6; }
    .product-cta { font-size: 11px; letter-spacing: 0.1em; color: var(--bark); border-bottom: 1px solid var(--warm); padding-bottom: 1px; opacity: 0; transition: opacity 200ms; align-self: flex-start; }
    .product:hover .product-cta { opacity: 1; }

    /* FOOTER */
    .footer { background: var(--ink); color: rgba(253,250,247,0.5); padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .footer .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: #fdfaf7; font-weight: 300; letter-spacing: 0.06em; }
    .footer p { font-size: 11px; }
    .footer a { font-size: 11px; letter-spacing: 0.08em; transition: color 200ms; }
    .footer a:hover { color: #fdfaf7; }

    @media (max-width: 768px) {
      .nav { padding: 18px 20px; }
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      .page-header { padding: 40px 20px 28px; flex-direction: column; gap: 6px; }
      .shop { padding: 24px 20px 60px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 24px 16px; }
      .footer { padding: 24px 20px; flex-direction: column; text-align: center; gap: 8px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-logo">madey</a>
    <ul class="nav-links">
      <li><a href="/gallery" class="active">gallery</a></li>
      <li><a href="/about">about</a></li>
      <li><a href="/home#contact">contact</a></li>
      <li><a href="https://www.instagram.com/madeydesign" target="_blank" rel="noopener">instagram ↗</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="Menu"><span></span><span></span></button>
  </nav>

  <div class="mobile-menu" id="mobileMenu" hidden>
    <button class="mobile-menu-close" id="mobileClose">✕</button>
    <ul>
      <li><a href="/gallery">gallery</a></li>
      <li><a href="/about">about</a></li>
      <li><a href="/home#contact">contact</a></li>
      <li><a href="https://www.instagram.com/madeydesign" target="_blank" rel="noopener">instagram ↗</a></li>
    </ul>
  </div>

  <div class="page-header">
    <h1>The <em>collection</em></h1>
    <p>all sold · inquire to commission</p>
  </div>

  <section class="shop">
    <div class="grid" id="productGrid">

      <a href="/home#contact" class="product">
        <div class="product-img" style="background: #e8e2da; display:flex; align-items:center; justify-content:center;">
          <div style="text-align:center; padding: 32px;">
            <p style="font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:300; line-height:1.4; color:var(--ink);">Something<br/><em>custom?</em></p>
            <p style="font-size:11px; letter-spacing:0.1em; color:var(--bark); margin-top:12px;">get in touch →</p>
          </div>
        </div>
        <div class="product-info">
          <span class="product-name">Custom Order</span>
          <span class="product-sold">sold</span><span class="product-cta">inquire →</span>
        </div>
      </a>

    </div>
  </section>

  <footer class="footer">
    <span class="logo">madey</span>
    <p>© 2026 Madey Design</p>
    <a href="https://www.instagram.com/madeydesign" target="_blank" rel="noopener">@madeydesign</a>
  </footer>

  <script>
    const hamburger = document.querySelector('.nav-hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    document.getElementById('mobileClose').addEventListener('click', () => mobileMenu.hidden = true);
    hamburger.addEventListener('click', () => mobileMenu.hidden = false);
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => mobileMenu.hidden = true));

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    fetch('/api/products').then(r => r.json()).then(products => {
      const grid = document.getElementById('productGrid');
      const customCard = grid.firstElementChild;
      products.forEach(p => {
        const card = document.createElement('a');
        card.href = '/product?id=' + encodeURIComponent(p.id);
        card.className = 'product' + (p.wb ? ' wb-cool' : '');
        card.innerHTML = `
          <div class="product-img">
            <img src="${p.image}" alt="${escapeHtml(p.name)}" />
          </div>
          <div class="product-info">
            <span class="product-name">${escapeHtml(p.name)}</span>
            ${p.sold !== false ? '<span class="product-sold">sold</span>' : ''}<span class="product-cta">inquire →</span>
          </div>`;
        grid.insertBefore(card, customCard);
      });

      document.getElementById('collectionLd').textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'CollectionPage',
        name: 'Madey Design — Gallery',
        description: 'Handcrafted wood objects and furniture by Yedam Park, made in San Francisco.',
        url: 'https://madey.com/gallery',
        author: { '@id': 'https://madey.com/#yedam' },
        hasPart: products.map(p => ({
          '@type': 'Product',
          name: p.name,
          url: 'https://madey.com/product?id=' + p.id,
          image: p.image.startsWith('http') ? p.image : 'https://madey.com' + p.image,
          brand: { '@id': 'https://madey.com/#business' },
        })),
      });
    });
  </script>
</body>
</html>
